<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @keyframes ring {
      0%   { transform: scale(1);   opacity: 0.65; }
      100% { transform: scale(2.6); opacity: 0;    }
    }
    .r1 { animation: ring 1.95s ease-out 0s    infinite; transform-origin: 16px 16px; }
    .r2 { animation: ring 1.95s ease-out 0.65s infinite; transform-origin: 16px 16px; }
    .r3 { animation: ring 1.95s ease-out 1.3s  infinite; transform-origin: 16px 16px; }
  </style>

  <!-- Anillos expansivos -->
  <circle class="r1" cx="16" cy="16" r="8" fill="none" stroke="#2dd4bf" stroke-width="1.4" opacity="0"/>
  <circle class="r2" cx="16" cy="16" r="8" fill="none" stroke="#2dd4bf" stroke-width="1.4" opacity="0"/>
  <circle class="r3" cx="16" cy="16" r="8" fill="none" stroke="#2dd4bf" stroke-width="1.4" opacity="0"/>

  <!-- Cuadro aguamarina (llena casi todo el viewBox) -->
  <rect x="2" y="2" width="28" height="28" rx="7" ry="7" fill="#2dd4bf"/>

  <!-- A blanca -->
  <text x="16" y="24" text-anchor="middle"
        font-family="Michroma, 'Courier New', monospace"
        font-weight="700" font-size="22" fill="#ffffff">A</text>
</svg>
